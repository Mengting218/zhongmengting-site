name: 自动更新新闻与股票内容

on:
  schedule:
    # 北京时间 09:30 → UTC 01:30（工作日）
    - cron: "30 1 * * 1-5"
  # 允许在 GitHub 页面手动触发，方便测试
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行内容生成脚本
        run: python generate_content.py --all

      - name: 提交并推送更新
        run: |
          git config user.name  "Pulse Daily Bot"
          git config user.email "bot@pulse-daily"
          git add news.json stocks.json chain.json
          git diff --cached --quiet \
            && echo "内容无变化，跳过提交。" \
            || git commit -m "auto: 更新内容 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')" \
            && git push
